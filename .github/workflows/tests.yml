name: Validación de Ally Community
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas-api:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar sintaxis
        run: |
          node --check public/app.js
          node --check public/mascot.js
          node --check public/mascot-motion.js
          node --check functions/api/'[[path]].js'
      - name: Pruebas API y SQLite
        run: |
          node tests/api.mjs
          node tests/mascot-motion.mjs
